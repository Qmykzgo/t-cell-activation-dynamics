name: tcell-activation
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── R ─────────────────────────────────────────────────────────────────────
  - r-base=4.3.2
  - r-essentials

  # ── System libraries required by R packages ───────────────────────────────
  - libxml2          # XML / curl dependencies
  - libcurl          # httr / RCurl
  - openssl          # httr SSL
  - cairo            # cairo_pdf device in ggplot2
  - pandoc>=3.1      # Quarto rendering
  - quarto>=1.4      # Quarto CLI

  # ── Bioconductor (via conda-forge/bioconda) ───────────────────────────────
  - bioconductor-deseq2>=1.42
  - bioconductor-geoquery>=2.70
  - bioconductor-biocparallel>=1.36
  - bioconductor-mfuzz>=2.66
  - bioconductor-clusterprofiler>=4.10
  - bioconductor-org.hs.eg.db>=3.18
  - bioconductor-annotationdbi>=1.64
  - bioconductor-glmgampoi>=1.14
  - bioconductor-apeglm>=1.24
  - bioconductor-summarizedexperiment>=1.32
  - bioconductor-biobase>=2.62

  # ── CRAN packages ─────────────────────────────────────────────────────────
  - r-targets>=1.6
  - r-tarchetypes>=0.7
  - r-renv>=1.0
  - r-dplyr>=1.1
  - r-tidyr>=1.3
  - r-purrr>=1.0
  - r-tibble>=3.2
  - r-stringr>=1.5
  - r-readr>=2.1
  - r-ggplot2>=3.5
  - r-ggrepel>=0.9
  - r-patchwork>=1.2
  - r-pheatmap>=1.0.12
  - r-rcolorbrewer>=1.1
  - r-scales>=1.3
  - r-nmf>=0.28
  - r-mclust>=6.0
  - r-splines          # base R — no install needed
  - r-matrixstats>=1.2
  - r-edger>=4.0
  - r-ashr>=2.2
  - r-knitr>=1.45
  - r-kableextra>=1.3
  - r-rmarkdown>=2.25
